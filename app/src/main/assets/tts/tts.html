<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>内置离线语音引擎</title>
</head>
<body>
<!-- 内置 eSpeak/meSpeak 引擎：所有脚本与音色均为本地文件，朗读过程不访问网络 -->
<script src="config.js"></script>
<script src="en-us.js"></script>
<script src="en-rp.js"></script>
<script src="mespeak.bundle.js"></script>
<script>
(function () {
  // 与 Android 侧桥接：只上报日志与结果，音频由 meSpeak 在本 WebView 内播放
  function log(message) {
    try { AndroidTts.log(String(message)); } catch (ignore) { /* 桥未就绪时忽略 */ }
  }

  function ensureVoice(voice) {
    if (!window.meSpeak) return false;
    if (!meSpeak.isConfigLoaded() && window.__MESPEAK_CONFIG__) {
      meSpeak.loadConfig(window.__MESPEAK_CONFIG__);
    }
    var voiceData = window.__MESPEAK_VOICES__ ? window.__MESPEAK_VOICES__[voice] : null;
    if (voiceData && !meSpeak.isVoiceLoaded(voice)) {
      meSpeak.loadVoice(voiceData);
    }
    meSpeak.setDefaultVoice(voice);
    return true;
  }

  // Android 调用入口：text 为要朗读的单词，accent 为 "US" / "UK"
  window.speakWord = function (text, accent) {
    try {
      var voice = accent === "UK" ? "en/en-rp" : "en/en-us";
      if (!ensureVoice(voice)) {
        log("语音引擎未就绪");
        return false;
      }
      meSpeak.stop();
      meSpeak.speak(String(text), {
        voice: voice,
        speed: 145,
        amplitude: 120,
        pitch: 45
      });
      AndroidTts.onSpeak(String(text), voice);
      return true;
    } catch (error) {
      AndroidTts.onError(String(error));
      return false;
    }
  };

  window.stopSpeaking = function () {
    try { if (window.meSpeak) meSpeak.stop(); } catch (ignore) { /* 忽略 */ }
  };

  // 引擎与音色脚本加载完成后通知 Android 侧，避免初始化前的发音请求丢失
  var readyTimer = setInterval(function () {
    if (window.meSpeak && window.__MESPEAK_CONFIG__ && window.__MESPEAK_VOICES__) {
      clearInterval(readyTimer);
      AndroidTts.onReady();
    }
  }, 50);
})();
</script>
</body>
</html>
